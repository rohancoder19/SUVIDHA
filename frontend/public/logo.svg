<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9933" />
      <stop offset="100%" stop-color="#E65100" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="childGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Outer Tricolor Arch -->
  <path d="M 60 220 A 200 160 0 0 1 440 220" fill="none" stroke="url(#saffronGrad)" stroke-width="24" stroke-linecap="round" />
  <path d="M 75 228 A 185 145 0 0 1 425 228" fill="none" stroke="#FFFFFF" stroke-width="12" />
  <path d="M 85 235 A 175 135 0 0 1 415 235" fill="none" stroke="url(#greenGrad)" stroke-width="16" stroke-linecap="round" />

  <!-- Top Ashoka Chakra Emblem -->
  <g transform="translate(250, 75)">
    <circle cx="0" cy="0" r="32" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="6" filter="url(#shadow)" />
    <circle cx="0" cy="0" r="8" fill="#1E3A8A" />
    <circle cx="0" cy="0" r="28" fill="none" stroke="#1E3A8A" stroke-width="2" />
    <!-- 24 Spokes -->
    <g stroke="#1E3A8A" stroke-width="1.8">
      <line x1="0" y1="-28" x2="0" y2="28" />
      <line x1="-28" y1="0" x2="28" y2="0" />
      <line x1="-20" y1="-20" x2="20" y2="20" />
      <line x1="-20" y1="20" x2="20" y2="-20" />
      <line x1="-10" y1="-26" x2="10" y2="26" />
      <line x1="-26" y1="-10" x2="26" y2="10" />
      <line x1="-10" y1="26" x2="10" y2="-26" />
      <line x1="-26" y1="10" x2="26" y2="-10" />
    </g>
  </g>

  <!-- Protective Caring Hands (Left Saffron, Right Green) -->
  <!-- Left Hand (Saffron) -->
  <path d="M 50 250 C 40 380, 180 470, 250 480 C 190 440, 100 370, 90 270 Z" fill="url(#saffronGrad)" filter="url(#shadow)" />
  <path d="M 65 290 C 75 350, 160 420, 220 440 C 170 410, 110 360, 100 300 Z" fill="#FFFFFF" opacity="0.8" />
  
  <!-- Right Hand (Green) -->
  <path d="M 450 250 C 460 380, 320 470, 250 480 C 310 440, 400 370, 410 270 Z" fill="url(#greenGrad)" filter="url(#shadow)" />

  <!-- Center Family Silhouettes -->
  <!-- Father (Blue) -->
  <g transform="translate(180, 200)">
    <circle cx="20" cy="20" r="22" fill="url(#blueGrad)" />
    <path d="M 20 45 C -10 65, -15 150, 50 160 C 55 120, 40 85, 20 45 Z" fill="url(#blueGrad)" />
  </g>

  <!-- Mother (Green) -->
  <g transform="translate(270, 200)">
    <circle cx="30" cy="20" r="22" fill="url(#greenGrad)" />
    <path d="M 30 45 C 60 65, 65 150, 0 160 C -5 120, 10 85, 30 45 Z" fill="url(#greenGrad)" />
  </g>

  <!-- Child with Joyful Open Arms (Orange/Gold) -->
  <g transform="translate(250, 250)">
    <circle cx="0" cy="0" r="20" fill="url(#childGrad)" filter="url(#shadow)" />
    <!-- Arms raised upward in joy -->
    <path d="M 0 25 C -45 5, -55 -15, -45 -25 C -35 -20, -20 5, 0 20 C 20 5, 35 -20, 45 -25 C 55 -15, 45 5, 0 25 Z" fill="url(#childGrad)" />
    <!-- Body -->
    <path d="M -22 25 L 22 25 L 30 110 L -30 110 Z" fill="url(#childGrad)" />
  </g>

</svg>
